name: CI

on:
  pull_request:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115" "pydantic>=2.7" "python-multipart>=0.0.28" httpx pytest

      - name: Run translation tests
        run: python -m pytest tests/test_translation.py -v

      - name: Run API regression tests
        run: python -m pytest tests/test_chat.py tests/test_embedding.py tests/test_tts.py tests/test_asr.py -v
